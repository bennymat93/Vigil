name: Build & Release

on:
  push:
    tags: ["v*"]          # a tag like v1.0.0 builds and publishes a release
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Vigil.exe (MSVC)
        shell: pwsh
        run: ./build.ps1

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          New-Item -ItemType Directory -Force installer\Output | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\Vigil.nsi

      - name: Show binary info
        shell: pwsh
        run: Get-Item build/Vigil.exe | Format-List Name, Length, VersionInfo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vigil
          path: |
            build/Vigil.exe
            installer/Output/Vigil-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Vigil.exe
            installer/Output/Vigil-Setup.exe
          generate_release_notes: true
